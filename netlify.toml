# Netlify config for the static export. See docs/deployment.md.
[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"
  # Final URL (canonical, sitemap, Open Graph). Change if the subdomain changes.
  NEXT_PUBLIC_SITE_URL = "https://hairloss.harleystreetmedicalwellness.co.uk"
  # Keep "false" until launch is approved; then set to "true" in the Netlify UI and redeploy.
  NEXT_PUBLIC_ALLOW_INDEXING = "false"
  # Tracking IDs (loaded only after cookie consent). Set in the Netlify UI when confirmed.
  # NEXT_PUBLIC_GTM_ID = ""
  # NEXT_PUBLIC_GA4_ID = ""
  # NEXT_PUBLIC_META_PIXEL_ID = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
